name: Pravah Eval Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  eval-gate:
    name: Run LLM Evals and Regression Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Validate LLM Judge Agreement against 30 Hand-Labeled Cases
        run: |
          .venv/bin/python scripts/validate_judge.py

      - name: Run Test Suite and CI Evaluation Gate
        env:
          WORKER_AUTH_SECRET: "pravah-eval-secret-key-12345"
          MOCK_LLM: "true"
        run: |
          .venv/bin/pytest -v --cov=app --cov-report=term-missing
